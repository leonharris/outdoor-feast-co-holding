<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outdoor Feast Co. — Extraordinary food experiences, brought to life outdoors.</title>
  <meta name="description" content="Extraordinary food experiences, brought to life outdoors.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Open Graph -->
  <meta property="og:title" content="Outdoor Feast Co.">
  <meta property="og:description" content="Extraordinary food experiences, brought to life outdoors.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="img/logo.webp">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Outdoor Feast Co.">
  <meta name="twitter:description" content="Extraordinary food experiences, brought to life outdoors.">
  <meta name="twitter:image" content="img/logo.webp">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .logo-wrap {
      width: min(480px, 80vw);
    }

    .logo-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img src="img/logo.webp" alt="Outdoor Feast Co.">
  </div>
</body>
</html>
